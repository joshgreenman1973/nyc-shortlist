name: Check links

on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays, 7:17 a.m. New York time (EDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every link
        id: check
        run: |
          set +e
          python3 scripts/check_links.py
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Commit results
        run: |
          git config user.name "shortlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/linkcheck.json
          git diff --cached --quiet || git commit -m "Link check $(date -u +%F) [skip ci]"
          git push
      - name: Fail if a link has been down twice in a row
        if: steps.check.outputs.status != '0'
        run: exit 1
